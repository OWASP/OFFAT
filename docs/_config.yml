title: OWASP OFFAT
description: >-
  OFFensive Api Tester - automated API security testing, from an OpenAPI spec
  or straight from source.
theme: just-the-docs

# Published at https://owasp.github.io/OFFAT/ via GitHub Actions (see
# .github/workflows/pages.yml). The workflow passes --baseurl, but set these
# so local `bundle exec jekyll serve` matches production.
url: https://owasp.github.io
baseurl: /OFFAT

logo: /assets/offat.png
color_scheme: dark

search_enabled: true
search:
  heading_level: 2
  previews: 3
  button: true

heading_anchors: true

aux_links:
  GitHub:
    - https://github.com/OWASP/OFFAT
  PyPI:
    - https://pypi.org/project/offat/
aux_links_new_tab: true

nav_external_links:
  - title: Report an issue
    url: https://github.com/OWASP/OFFAT/issues
    hide_icon: false

footer_content: >-
  OWASP OFFAT is distributed under the MIT License. Only test systems you own
  or are explicitly authorized to assess.

# These are design/internal docs with repo-relative links; they live in the
# repo for contributors but are not built as site pages.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - architecture.md
  - platform.md
  - whitebox.md
  - graybox.md
