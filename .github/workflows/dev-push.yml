name: "Build and push dev/main OWASP OFFAT image to Docker Hub"

on:
  push:
    branches:
      - "main"
      - "dev"

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # One image: Rust execution engine + the Python platform (docker/Dockerfile).
      - name: Build and push offat image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/offat:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
