name: "Build and push dev/main OWASP OFFAT image"

on:
  push:
    branches:
      - "main"
      - "dev"

# GHCR is the reliable publish (GITHUB_TOKEN, no secret to expire); Docker Hub is
# best-effort and only runs when its secret is configured.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Lowercase image repo
        id: img
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # --- GitHub Container Registry (authoritative) ---
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.img.outputs.repo }}:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Docker Hub (best-effort: skipped without a secret, never fails the job) ---
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/offat:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
