name: docs

# Build the documentation site (docs/build.py -> docs/_site) and deploy it to
# GitHub Pages. Requires Pages "Build and deployment" source = GitHub Actions.
on:
  push:
    branches: [dev]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the docs site
        run: |
          pip install -r docs/requirements.txt
          python docs/build.py
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
