name: ci

on:
  push:
    branches: [main, dev, "claude/**"]
  pull_request:

jobs:
  engine-rust:
    name: Execution engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo test --locked

  viz:
    name: Visualizer (static)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check app.js
      - run: node tests/dom_smoke.js

  smoke:
    name: End-to-end smoke (platform, offline)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: platform:graybox:whitebox:triager:bundle:reporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Pipeline (map -> prg -> threat-model -> test-gen -> triage)
        run: |
          python3 -m offat_platform map graybox/tests/fixtures/app --no-graft --threat-model -o /tmp/b.offat.json
          python3 -m offat_platform test-gen /tmp/b.offat.json
          python3 -m offat_platform triage /tmp/b.offat.json --no-ai
          python3 -m offat_platform validate /tmp/b.offat.json
      - name: Reports (bundle -> sarif/md/html/compliance)
        run: python3 -m offat_report /tmp/b.offat.json -o /tmp/reports --formats sarif,md,html,compliance
      - name: Assert mapped + reported
        run: |
          python3 - <<'PY'
          import json, os
          b = json.load(open("/tmp/b.offat.json"))
          assert b["summary"]["endpoints"] >= 2, b["summary"]
          for f in ("results.sarif", "report.md", "report.html", "compliance.md"):
              assert os.path.exists(os.path.join("/tmp/reports", f)), f
          print("endpoints:", b["summary"]["endpoints"], "findings:", b["summary"]["findings"])
          PY

  python:
    name: Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python3 -m compileall -q bundle/offat_bundle triager/offat_triage whitebox/offat_wb graybox/offat_gb platform/offat_platform reporter/offat_report
      - name: Install packages
        run: pip install ./bundle ./triager ./whitebox ./graybox ./platform ./reporter jsonschema pyyaml
      - name: Bundle unit tests
        run: PYTHONPATH=bundle python3 -m unittest discover -s bundle/tests -p 'test_*.py'
      - name: Triager unit tests
        run: PYTHONPATH=triager python3 -m unittest discover -s triager/tests -p 'test_*.py'
      - name: White-box unit tests
        run: PYTHONPATH=whitebox:triager python3 -m unittest discover -s whitebox/tests -p 'test_*.py'
      - name: Gray-box unit tests
        run: PYTHONPATH=graybox:whitebox:triager python3 -m unittest discover -s graybox/tests -p 'test_*.py'
      - name: Platform unit tests
        run: PYTHONPATH=platform:graybox:whitebox:triager:bundle python3 -m unittest discover -s platform/tests -p 'test_*.py'
      - name: Reporter unit tests
        run: PYTHONPATH=reporter:triager python3 -m unittest discover -s reporter/tests -p 'test_*.py'
