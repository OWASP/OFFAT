name: ci

on:
  push:
    branches: [main, dev, "claude/**"]
  pull_request:

jobs:
  engine-rust:
    name: Execution engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo test --locked

  dast-go:
    name: DAST engine (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: dast/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo 'run gofmt -w' && exit 1)

  smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: dast/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build DAST binary
        run: make dast
      - name: DAST dry-run (offline)
        run: ./bin/offat-dast --spec examples/vulnshop-openapi.yaml --kb knowledge-base --graph --dry-run
      - name: White-box pipeline (offline)
        run: PYTHONPATH=whitebox:triager python3 -m offat_wb examples/vuln-code --no-ai -o /tmp/wb
      - name: Gray-box pipeline (offline, no graft/AI)
        run: PYTHONPATH=graybox:whitebox:triager python3 -m offat_gb graybox/tests/fixtures/app --no-ai --no-graft -o /tmp/gb
      - name: Assert gray-box mapped endpoints
        run: |
          python3 - <<'PY'
          import json
          eps = json.load(open("/tmp/gb/endpoints.json"))
          assert len(eps) >= 2, eps
          rep = json.load(open("/tmp/gb/report.json"))
          assert rep["mode"] == "graybox"
          assert rep["summary"]["endpoints"] >= 2
          print("gray-box endpoints:", rep["summary"]["endpoints"], "findings:", rep["summary"]["total"])
          PY
      - name: Assert findings produced
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/wb/report.json"))
          assert r["summary"]["total"] > 0, "expected white-box findings"
          print("white-box findings:", r["summary"]["total"])
          PY

  python:
    name: Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python3 -m compileall -q triager/offat_triage whitebox/offat_wb graybox/offat_gb bundle/offat_bundle platform/offat_platform reporter/offat_report
      - name: Install packages
        run: pip install ./triager ./whitebox ./graybox ./bundle ./platform ./reporter jsonschema pyyaml
      - name: Bundle unit tests (offline, jsonschema path)
        run: PYTHONPATH=bundle python3 -m unittest discover -s bundle/tests -p 'test_*.py'
      - name: Platform unit tests (offline)
        run: PYTHONPATH=platform:graybox:whitebox:triager:bundle python3 -m unittest discover -s platform/tests -p 'test_*.py'
      - name: Reporter unit tests (offline)
        run: PYTHONPATH=reporter:triager python3 -m unittest discover -s reporter/tests -p 'test_*.py'
      - name: Triager unit tests (offline)
        run: PYTHONPATH=triager python3 -m unittest discover -s triager/tests -p 'test_*.py'
      - name: White-box unit tests (offline)
        run: PYTHONPATH=whitebox:triager python3 -m unittest discover -s whitebox/tests -p 'test_*.py'
      - name: Gray-box unit tests (offline)
        run: PYTHONPATH=graybox:whitebox:triager python3 -m unittest discover -s graybox/tests -p 'test_*.py'
      - name: Triage smoke (heuristic)
        run: |
          printf '[{"class":"sqli","severity":"high","confidence":0.9,"title":"t"}]' > /tmp/f.json
          offat-triage /tmp/f.json --no-ai
      - name: Triage smoke (CLI provider via stub)
        run: |
          printf '#!/bin/sh\necho "{\\"verdict\\":\\"confirmed\\",\\"confidence\\":0.9,\\"severity\\":\\"high\\"}"\n' > /tmp/stub
          chmod +x /tmp/stub
          OFFAT_AI_CODEX_CMD=/tmp/stub offat-triage /tmp/f.json --provider codex -o /tmp/t.json
          python3 -c "import json; d=json.load(open('/tmp/t.json')); assert d[0]['triage']['source']=='codex', d; print('CLI provider OK')"
