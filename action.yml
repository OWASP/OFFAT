name: 'OWASP OFFAT'
description: 'Source-aware API security testing: map from code, prove source-to-sink flows, triage with AI, report as SARIF'
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: 'path to the source tree (and/or OpenAPI spec) to analyze'
    required: false
    default: '.'
  url:
    description: 'base URL of a target you are authorized to test. Empty = source-only run (no traffic sent)'
    required: false
    default: ''
  authorized:
    description: "must be 'true' for a live run against url - confirms you own or are authorized to test the target"
    required: false
    default: 'false'
  identities:
    description: 'optional identities JSON (enables BOLA / BFLA / RBAC / auth checks on live runs)'
    required: false
    default: ''
  fail_on:
    description: 'fail the job when an actionable finding is at or above this severity (critical|high|medium|low)'
    required: false
    default: ''
  formats:
    description: 'report formats (sarif,md,html,compliance,pdf or all)'
    required: false
    default: 'all'
  upload_sarif:
    description: "'true' to upload results.sarif to GitHub code scanning (needs security-events: write)"
    required: false
    default: 'false'
  artifact_retention_days:
    description: 'report artifact retention period in days'
    required: false
    default: '7'

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install OFFAT
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        pip install ./bundle ./triager './whitebox[graph]' ./graybox ./platform ./reporter

    - name: Build the execution engine (live runs only)
      if: inputs.url != '' && inputs.authorized == 'true'
      shell: bash
      run: |
        cargo build --release --manifest-path "$GITHUB_ACTION_PATH/engine-rs/Cargo.toml"
        echo "OFFAT_ENGINE=$GITHUB_ACTION_PATH/engine-rs/target/release/offat-engine" >> "$GITHUB_ENV"

    - name: Run OFFAT
      shell: bash
      env:
        OFFAT_PATH: ${{ inputs.path }}
        OFFAT_URL: ${{ inputs.url }}
        OFFAT_AUTHORIZED: ${{ inputs.authorized }}
        OFFAT_IDENTITIES: ${{ inputs.identities }}
        OFFAT_FAIL_ON: ${{ inputs.fail_on }}
        OFFAT_FORMATS: ${{ inputs.formats }}
      run: |
        args=(run "$OFFAT_PATH" -o offat-out/app.offat.json --report-dir offat-out/reports --formats "$OFFAT_FORMATS")
        if [ -n "$OFFAT_URL" ]; then
          if [ "$OFFAT_AUTHORIZED" != "true" ]; then
            echo "::error::url is set but authorized is not 'true'. Live runs send real traffic; only test targets you are authorized to assess."
            exit 2
          fi
          args+=(--url "$OFFAT_URL" --yes)
          [ -n "$OFFAT_IDENTITIES" ] && args+=(--identities "$OFFAT_IDENTITIES")
        fi
        [ -n "$OFFAT_FAIL_ON" ] && args+=(--fail-on "$OFFAT_FAIL_ON")
        offat-platform "${args[@]}"

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: offat-reports
        path: offat-out/
        retention-days: ${{ inputs.artifact_retention_days }}

    - name: Upload SARIF to code scanning
      if: always() && inputs.upload_sarif == 'true' && hashFiles('offat-out/reports/results.sarif') != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: offat-out/reports/results.sarif
        category: offat
