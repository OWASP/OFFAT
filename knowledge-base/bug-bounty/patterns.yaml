# Attack patterns distilled from recurring public bug-bounty disclosures.
# Each is encoded as a generic, reusable technique (not any single report's
# proprietary content). References point to the vulnerability class / program
# guidance rather than individual reports.
vectors:
  - id: bb-idor-numeric-enum
    class: access_control
    title: "IDOR via numeric identifier enumeration"
    severity: high
    cwe: CWE-639
    owasp: "API1:2023"
    description: >
      The single most-reported bug-bounty class. Numeric object ids are
      enumerable; requesting neighbouring ids (n-1, n+1, 1, 0) as another
      principal frequently returns objects the caller does not own. Handled by
      the BOLA engine, which also seeds adjacent and foreign identifiers.
    references:
      - https://hackerone.com/hacktivity?querystring=idor
      - https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
    structural: bola
    applies_to:
      locations: [path, query]
      types: [integer, string, any]

  - id: bb-jwt-kid-injection
    class: broken_auth
    title: "JWT kid header injection (path/SQL)"
    severity: high
    cwe: CWE-347
    owasp: "API2:2023"
    description: >
      A frequently disclosed pattern: the JWT `kid` header is used to select a
      signing key by file path or DB lookup, allowing path traversal or SQL
      injection to force a known key. Combined here with the alg=none forgery
      check; verify manually where a custom kid is accepted.
    references:
      - https://portswigger.net/web-security/jwt
    structural: jwt_none
    applies_to:
      locations: [header]
      types: [any]

  - id: bb-ssrf-redirect-metadata
    class: ssrf
    title: "SSRF to cloud metadata via open redirect / URL param"
    severity: critical
    cwe: CWE-918
    owasp: "API7:2023"
    description: >
      URL-accepting parameters (webhooks, avatar/image fetch, import-from-url)
      are pointed at cloud metadata endpoints and internal services. A recurring
      high-bounty pattern, often chained through an open redirect to bypass
      allowlists.
    references:
      - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
    applies_to:
      locations: [query, body, path]
      types: [string, any]
      name_patterns: ["(?i)(url|uri|link|src|image|avatar|import|fetch|webhook|callback|proxy|feed|next|redirect)"]
    payloads:
      - {value: "http://169.254.169.254/latest/meta-data/iam/security-credentials/", technique: reflection}
      - {value: "http://[::ffff:169.254.169.254]/latest/meta-data/", technique: reflection}
      - {value: "http://169.254.169.254.nip.io/latest/meta-data/", technique: reflection}
      - {value: "http://2852039166/latest/meta-data/", technique: reflection, note: "decimal IP for 169.254.169.254"}
    detection:
      body_regex:
        - "iam/security-credentials"
        - "ami-id"
        - "accessKeyId"

  - id: bb-mass-assignment-role
    class: mass_assignment
    title: "Privilege escalation via mass assignment on profile/registration"
    severity: high
    cwe: CWE-915
    owasp: "API3:2023"
    description: >
      Registration and profile-update endpoints that bind the request body to
      the model let attackers set role/is_admin/verified. A very common
      escalation primitive in disclosed reports.
    references:
      - https://owasp.org/API-Security/editions/2023/en/0xa3-broken-object-property-level-authorization/
    structural: mass_assignment
    applies_to:
      locations: [body]
      types: [any]
      methods: [POST, PUT, PATCH]

  - id: bb-price-tampering
    class: mass_assignment
    title: "Business-logic tampering (price/quantity/currency)"
    severity: high
    cwe: CWE-840
    owasp: "API6:2023 Unrestricted Access to Sensitive Business Flows"
    description: >
      Checkout/order endpoints that trust client-supplied price, total,
      discount or quantity fields. Sends negative and zero values; a 2xx that
      reflects the tampered amount warrants manual confirmation.
    references:
      - https://owasp.org/API-Security/editions/2023/en/0xa6-unrestricted-access-to-sensitive-business-flows/
    applies_to:
      locations: [body, query]
      types: [integer, number, any]
      name_patterns: ["(?i)(price|amount|total|cost|qty|quantity|discount|balance|credit|currency)"]
    payloads:
      - {value: "-1", technique: diff}
      - {value: "0", technique: diff}
      - {value: "0.01", technique: diff}
      - {value: "999999999", technique: diff}
    detection:
      status_codes: [200, 201]

  - id: bb-pagination-abuse
    class: security_misconfig
    title: "Resource exhaustion via unbounded page size"
    severity: low
    cwe: CWE-770
    owasp: "API4:2023"
    description: >
      limit/per_page/size parameters without an upper bound let a client pull
      the entire dataset in one call. Sends an extreme page size.
    references:
      - https://owasp.org/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption/
    applies_to:
      locations: [query]
      types: [integer, number, any]
      name_patterns: ["(?i)(limit|per_?page|page_?size|size|count|max|rows)"]
    payloads:
      - {value: "1000000", technique: diff}
      - {value: "-1", technique: diff}
    detection:
      status_codes: [200]

  - id: bb-account-takeover-email
    class: access_control
    title: "Account takeover via unvalidated email/identifier change"
    severity: high
    cwe: CWE-640
    owasp: "API1:2023"
    description: >
      Endpoints that change email/username/phone without verifying ownership or
      current password. Flagged for manual review when a write to another
      principal's contact field returns 2xx.
    references:
      - https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
    structural: bola
    applies_to:
      locations: [path, query]
      types: [any]
      name_patterns: ["(?i)(email|username|phone|user|account|id)"]
