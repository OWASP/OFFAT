# Structural / logic attacks. These use the dataflow graph and request
# structure rather than raw payload injection, so they carry a `structural`
# name that the attack generator understands.
vectors:
  - id: bola-idor
    class: access_control
    title: Broken Object Level Authorization (BOLA / IDOR)
    severity: critical
    cwe: CWE-639
    owasp: "API1:2023 Broken Object Level Authorization"
    description: >
      Substitutes object identifiers (from the dataflow graph, plus adjacent
      and enumerated values) into an endpoint while authenticated as another
      principal; a 2xx response to an object the caller should not own
      indicates BOLA.
    references:
      - https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
      - https://hackerone.com/reports (IDOR is the most reported bug class)
    structural: bola
    applies_to:
      locations: [path, query]
      types: [any]

  - id: bfla
    class: access_control
    title: Broken Function Level Authorization (BFLA)
    severity: high
    cwe: CWE-285
    owasp: "API5:2023 Broken Function Level Authorization"
    description: >
      Invokes privileged / administrative operations without the required
      role. A 2xx where a 401/403 is expected indicates BFLA.
    references:
      - https://owasp.org/API-Security/editions/2023/en/0xa5-broken-function-level-authorization/
    structural: bfla
    applies_to:
      locations: [path]
      types: [any]
      name_patterns: ["(?i)(admin|internal|manage|config|delete|approve|role|permission|grant)"]

  - id: mass-assignment
    class: mass_assignment
    title: Mass Assignment / BOPLA
    severity: high
    cwe: CWE-915
    owasp: "API3:2023 Broken Object Property Level Authorization"
    description: >
      Adds sensitive properties (role, is_admin, verified, balance, ...) to a
      write request body; acceptance of the extra field indicates mass
      assignment / broken property-level authorization.
    references:
      - https://owasp.org/API-Security/editions/2023/en/0xa3-broken-object-property-level-authorization/
    structural: mass_assignment
    applies_to:
      locations: [body]
      types: [any]
      methods: [POST, PUT, PATCH]

  - id: excessive-data-exposure
    class: data_exposure
    title: Excessive Data Exposure
    severity: medium
    cwe: CWE-213
    owasp: "API3:2023 Broken Object Property Level Authorization"
    description: >
      Flags responses that return sensitive-looking fields (password, token,
      ssn, secret, credit card) that clients should never receive.
    references:
      - https://owasp.org/API-Security/editions/2023/en/0xa3-broken-object-property-level-authorization/
    structural: data_exposure
    applies_to:
      locations: [body]
      types: [any]
