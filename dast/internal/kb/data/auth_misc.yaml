# Authentication, method tampering, and misconfiguration vectors.
vectors:
  - id: auth-bypass-missing
    class: broken_auth
    title: Missing Authentication / Broken Authentication
    severity: high
    cwe: CWE-306
    owasp: "API2:2023 Broken Authentication"
    description: >
      Repeats a request that declares a security requirement with the
      credentials removed. A 2xx response indicates the auth control is not
      enforced server-side.
    references:
      - https://owasp.org/API-Security/editions/2023/en/0xa2-broken-authentication/
    structural: auth_bypass
    applies_to:
      locations: [header]
      types: [any]

  - id: jwt-alg-none
    class: broken_auth
    title: JWT alg=none / signature stripping
    severity: high
    cwe: CWE-347
    owasp: "API2:2023"
    description: >
      Re-signs the presented bearer JWT with the "none" algorithm and an empty
      signature. Acceptance indicates the verifier trusts the token header.
    references:
      - https://portswigger.net/web-security/jwt
    structural: jwt_none
    applies_to:
      locations: [header]
      types: [any]

  - id: http-method-tamper
    class: security_misconfig
    title: HTTP Method Tampering
    severity: medium
    cwe: CWE-650
    owasp: "API8:2023 Security Misconfiguration"
    description: >
      Replays an operation with unexpected/undocumented methods (and method
      override headers). A privileged verb succeeding where it is not defined
      indicates broken method handling.
    references:
      - https://owasp.org/www-project-web-security-testing-guide/
    structural: method_tamper
    applies_to:
      locations: [path]
      types: [any]

  - id: rate-limit-missing
    class: security_misconfig
    title: Missing Rate Limiting / Unrestricted Resource Consumption
    severity: low
    cwe: CWE-770
    owasp: "API4:2023 Unrestricted Resource Consumption"
    description: >
      Sends a burst of identical requests; the absence of any 429 / throttling
      response suggests missing rate limiting.
    references:
      - https://owasp.org/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption/
    structural: rate_limit
    applies_to:
      locations: [path]
      types: [any]

  - id: cors-misconfig
    class: security_misconfig
    title: CORS Misconfiguration
    severity: medium
    cwe: CWE-942
    owasp: "API8:2023"
    description: >
      Sends a crafted Origin; a reflected Access-Control-Allow-Origin combined
      with Allow-Credentials:true indicates an exploitable CORS policy.
    references:
      - https://portswigger.net/web-security/cors
    structural: cors
    applies_to:
      locations: [header]
      types: [any]
