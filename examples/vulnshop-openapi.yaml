openapi: 3.0.3
info:
  title: VulnShop API
  version: 1.0.0
servers:
  - url: https://api.vulnshop.example/v1
security:
  - bearerAuth: []
paths:
  /users:
    post:
      operationId: createUser
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{id}:
    get:
      operationId: getUser
      summary: Get a user by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200': { description: ok }
  /users/{id}/orders:
    get:
      operationId: listUserOrders
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [open, shipped, cancelled] }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /search:
    get:
      operationId: search
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: file
          in: query
          schema: { type: string }
      responses:
        '200': { description: ok }
  /admin/users/{userId}:
    delete:
      operationId: adminDeleteUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: deleted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        name: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string }
    OrderInput:
      type: object
      required: [userId, item]
      properties:
        userId: { type: string }
        item: { type: string }
        quantity: { type: integer }
    Order:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        item: { type: string }
        total: { type: number }
